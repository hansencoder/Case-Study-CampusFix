<ion-toolbar class="cf-brand-toolbar">
  <div class="brand-bar-inner">
    <div class="brand-left">
      @if (showBack) {
        <ion-back-button
          [defaultHref]="defaultHref"
          text=""
          class="brand-back-btn"
        ></ion-back-button>
      }

      @if (showBrandLogo) {
        <span class="brand-logo" aria-hidden="true">
          <svg viewBox="0 0 28 28" width="24" height="24" fill="none">
            <rect width="28" height="28" rx="8" fill="#323653" />
            <path
              d="M9.5 18.5L18.5 9.5M15.5 8.5L19.5 12.5M8.5 15.5L12.5 19.5"
              stroke="#F8F2ED"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </span>
      }

      <span class="brand-title">{{ title }}</span>
    </div>

    <div
      class="profile-avatar"
      title="Maya Patel (#90421)"
      aria-label="Student profile"
    >
      <span>MP</span>
    </div>
  </div>
</ion-toolbar>
